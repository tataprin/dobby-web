  <script>
    // If the browser mixes an old cached file with new ones right after an update, reload once from a fresh address:
    // a new address fetches a fresh index.html, whose import map points at the new files. Automatic at most once a minute.
    window.dobbyFreshReload = function (auto) {
      var now = Date.now();
      if (auto) {
        try {
          var last = +sessionStorage.getItem('dobby-fresh') || 0;
          if (now - last < 60000) return false;
          sessionStorage.setItem('dobby-fresh', String(now));
        } catch (e) { return false; }
      }
      var u = new URL(location.href);
      u.searchParams.set('_r', String(now));
      location.replace(u.href);
      return true;
    };
    (function () {
      var u = new URL(location.href);
      if (u.searchParams.has('_r')) {
        u.searchParams.delete('_r');
        history.replaceState(history.state, '', u.pathname + u.search + u.hash);
      }
      // the app's own files failed to load or fit together before it started
      window.addEventListener('error', function (ev) {
        if (document.documentElement.dataset.booted) return;
        var t = ev.target, msg = String(ev.message || '');
        var moduleFailed = t && t.tagName === 'SCRIPT' && t.type === 'module';
        if (moduleFailed || /requested module|export named|imported module|module script failed/i.test(msg)) {
          if (navigator.onLine !== false) window.dobbyFreshReload(true);
        }
      }, true);
    })();
