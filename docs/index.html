<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dobby</title>
  <meta name="description" content="Dobby Web: ดูบอททองของคุณแบบสด ดูประวัติ และสั่งงานบอท">
  <meta name="theme-color" content="#f4f3ee">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M7 8h18l6 16H1L7 8z' fill='%23c99a22'/%3E%3Cpath d='M7 8h18l-2.2 5.5H9.2L7 8z' fill='%23ecc65e'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // apply the saved theme before first paint (no flash)
    try { var t = localStorage.getItem('dobby-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <noscript>
      <div style="padding:24px;font-family:sans-serif">เว็บนี้ต้องเปิด JavaScript</div>
    </noscript>
  </div>
</body>
</html>
