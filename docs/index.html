<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dobby</title>
  <meta name="description" content="Dobby Web: ดูบอททองของคุณแบบสด ดูประวัติ และสั่งงานบอท">
  <meta name="theme-color" content="#F1F2EE">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M10.6 1.5h10.8l9.1 9.1v10.8l-9.1 9.1H10.6l-9.1-9.1V10.6z' fill='%23D4AE52'/%3E%3Cpath d='M11.6 4h8.8l7.6 7.6v8.8L20.4 28h-8.8L4 20.4v-8.8z' fill='none' stroke='%236B4E10' stroke-width='1.4'/%3E%3Ctext x='16' y='21.4' text-anchor='middle' font-family='Arial,sans-serif' font-weight='700' font-size='15' fill='%233A2A08'%3ED%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Anuphan: Thai + UI (the css2 API serves the thai / latin subsets by unicode-range). Chakra Petch: only the glyphs
       used for money, prices, lots and percentages (text=), so Thai inside a number span still falls back to Anuphan. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap&subset=thai">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&display=swap&text=0123456789.%2C%2B-%E2%88%92%25%24%3A%2F%C3%97()%E2%88%9EABCDEFGHIJKLMNOPQRSTUVWXYZ">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // apply the saved theme before first paint (no flash)
    try { var t = localStorage.getItem('dobby-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <noscript>
      <div style="padding:24px;font-family:sans-serif">เว็บนี้ต้องเปิด JavaScript</div>
    </noscript>
  </div>
</body>
</html>
